<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order confirmed · Grainline Creations</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect x='6' y='10' width='26' height='60' rx='4' fill='%237A4A26'/%3E%3Crect x='48' y='10' width='26' height='60' rx='4' fill='%237A4A26'/%3E%3Crect x='31' y='6' width='18' height='68' rx='9' fill='%23C08A3E'/%3E%3Cline x1='31' y1='29' x2='49' y2='29' stroke='%23F3ECE2' stroke-width='2'/%3E%3Cline x1='31' y1='51' x2='49' y2='51' stroke='%23F3ECE2' stroke-width='2'/%3E%3Ccircle cx='18' cy='24' r='3' fill='%23F3ECE2'/%3E%3Ccircle cx='18' cy='56' r='3' fill='%23F3ECE2'/%3E%3Ccircle cx='62' cy='24' r='3' fill='%23F3ECE2'/%3E%3Ccircle cx='62' cy='56' r='3' fill='%23F3ECE2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F2EC;
    --white: #FDFCFA;
    --ink:   #1D1B18;
    --muted: #645E55;
    --line:  #DCD5CA;
    --serif: 'Newsreader', Georgia, serif;
    --sans:  'Hanken Grotesk', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font-family: var(--sans); background: var(--paper); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .card { max-width: 560px; background: var(--white); padding: 56px 44px; text-align: center; border: 1px solid var(--line); }
  svg { width: 40px; height: 40px; margin: 0 auto; display: block; }
  .eyebrow { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin: 28px 0 12px; }
  h1 { margin: 0 0 18px; font-family: var(--serif); font-weight: 300; font-size: clamp(2rem, 5vw, 2.8rem); letter-spacing: -0.02em; line-height: 1.08; }
  p { margin: 0 0 14px; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; min-height: 52px; margin-top: 18px; padding: 0 32px; border-radius: 2px; background: var(--ink); color: var(--paper); font-weight: 500; text-decoration: none; }
  .btn:hover { background: #3A352F; }
  a { color: var(--ink); text-underline-offset: 3px; }
  @media (max-width: 560px) { .card { padding: 40px 22px; } }
</style>
</head>
<body>
  <main class="card">
    <svg viewBox="0 0 80 80" role="img" aria-label="Grainline Creations">
      <rect x="6"  y="10" width="26" height="60" rx="4" fill="#7A4A26"/>
      <rect x="48" y="10" width="26" height="60" rx="4" fill="#7A4A26"/>
      <rect x="31" y="6"  width="18" height="68" rx="9" fill="#C08A3E"/>
      <line x1="31" y1="29" x2="49" y2="29" stroke="#FDFCFA" stroke-width="2"/>
      <line x1="31" y1="51" x2="49" y2="51" stroke="#FDFCFA" stroke-width="2"/>
      <circle cx="18" cy="24" r="3" fill="#FDFCFA"/><circle cx="18" cy="56" r="3" fill="#FDFCFA"/>
      <circle cx="62" cy="24" r="3" fill="#FDFCFA"/><circle cx="62" cy="56" r="3" fill="#FDFCFA"/>
    </svg>
    <div class="eyebrow">Order confirmed</div>
    <h1>Thank you. We're on it.</h1>
    <p>Your receipt is on its way to your email. Every piece is made to order, so we'll start building yours by hand and email you when it ships.</p>
    <p>Questions about your order? Email <a href="mailto:creationsgrainline@gmail.com">creationsgrainline@gmail.com</a>.</p>
    <a class="btn" href="./">Back to Grainline</a>
  </main>
  <script>
    // The order went through, so empty the cart.
    try { localStorage.removeItem("gl-cart"); } catch {}
  </script>
</body>
</html>
